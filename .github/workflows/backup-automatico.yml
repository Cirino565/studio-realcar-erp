name: Backup automático Studio Realçar

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "America/Sao_Paulo"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-automatico-studio-realcar
  cancel-in-progress: false

jobs:
  backup:
    name: Enviar backup para Google Drive
    runs-on: ubuntu-latest

    steps:
      - name: Executar backup automático
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_CRON_SECRET }}
        run: |
          set -euo pipefail

          # Disparo manual (workflow_dispatch) sempre força um backup novo:
          # se a pessoa clicou em "Run workflow", é porque quer o backup agora.
          # O agendamento diário mantém a proteção contra backup duplicado.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            URL_BACKUP="https://app.studiorealcar.com.br/api/backup/automatico?forcar=1"
            echo "Disparo manual: forçando backup novo..."
          else
            URL_BACKUP="https://app.studiorealcar.com.br/api/backup/automatico"
            echo "Iniciando backup automático do Studio Realçar..."
          fi

          resposta=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${BACKUP_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${URL_BACKUP}")

          echo "Resposta do servidor:"
          echo "${resposta}"

          echo "Backup automático finalizado."